# Entorno conda de VAMCORE.
#   conda env create -f environment.yml
#   conda activate vamcore
#   pip install -e ".[app]"
name: vamcore
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26
  - scipy>=1.11
  - trimesh>=4.4
  - pytorch>=2.1          # conda-forge elige la variante con CUDA si hay GPU NVIDIA
  - matplotlib>=3.8
  - pillow>=10
  - opencv>=4.9
  - pip
  - pip:
    - fastapi>=0.115
    - uvicorn[standard]>=0.30
    - python-multipart>=0.0.9
    - requests>=2.31
