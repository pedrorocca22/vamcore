[include mainsail.cfg]

[mcu]
serial: /dev/serial0
baud: 250000
restart_method: command

# =========== CINEMÁTICA ===========
[printer]
kinematics: cartesian   # Requerido por Klipper para dejar activar los motores
max_velocity: 100       
max_accel: 500

# =========== EJES FALSOS (Para engañar a Klipper) ===========
# Klipper exige tener Eje X y Eje Y si usamos Cartesiano. Les damos pines al azar que están sin uso.
[stepper_x]
step_pin: gpio20
dir_pin: gpio19
enable_pin: !gpio18
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio22
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: gpio16
dir_pin: gpio15
enable_pin: !gpio14
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio24
position_endstop: 0
position_max: 200

# =========== MOTOR Z (EL REAL) ===========
# Conectado en la ranura marcada como "Z" en la placa física
[stepper_z]
step_pin: gpio12
dir_pin: !gpio11         # (Si el motor gira al revés, cambia esto por !gpio11)
enable_pin: !gpio10
microsteps: 16
rotation_distance: 72    # Milímetros por vuelta de tu varilla roscada
endstop_pin: !gpio23    # Pin del Endstop Z. (Quita el ! si marca todo el tiempo TRIGGERED en la consola)
position_endstop: 0.0
position_max: 6000      # Altura libre total de tu impresora en mm
homing_speed: 10           # Velocidad de bajada hacia el endstop (mm/s). Sube este valor para ir más rápido.
second_homing_speed: 5     # Velocidad del segundo toque (más lento y preciso). 
homing_retract_dist: 5     # Retrocede 3mm tras el primer toque antes del segundo intento de precisión.

# =========== DRIVER Z (TMC2209) ===========
[tmc2209 stepper_z]
uart_pin: gpio13
run_current: 0.800      # Amperios (ajústalo si el motor calienta)
stealthchop_threshold: 999999

# === RUTAS REQUERIDAS DE MAINSAIL ===
[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move] 
enable_force_move: true 